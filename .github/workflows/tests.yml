# =============================================================================
# Tests — pytest na matriz Python × SO. Instala apenas o núcleo leve (sem o
# extra `nlp`: torch/BERTopic/gensim); os testes `ml` são pulados via
# `pytest.importorskip`. Cobertura mínima de 80% garantida pelo fail_under.
# O upload para o Codecov roda apenas uma vez (ubuntu + 3.12).
# =============================================================================
name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências
        run: uv sync --dev

      - name: Rodar testes
        run: uv run --no-sync pytest -m "not slow"

      - name: Upload de cobertura (Codecov)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
